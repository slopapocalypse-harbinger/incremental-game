name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - cursor/birds-rebuild-233d

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.16.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Install layout browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Layout
        run: pnpm test:layout
      - name: Phone bundle matches a fresh build
        run: pnpm playtest:check
        env:
          PLAYTEST_BRANCH: ${{ github.head_ref || github.ref_name }}
